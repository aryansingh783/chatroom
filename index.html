<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💬 Dark Chat Entry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f172a;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      background: #1e293b;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      color: #f8fafc;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
    }

    @media (max-width: 500px) {
      h2 {
        font-size: 20px;
      }

      .btn {
        font-size: 15px;
        padding: 12px 20px;
      }

      .container {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>💬 Dark Chat</h2>
    <button class="btn" onclick="window.location.href = ngrokUrl">Join Now</button>
  </div>

  <script>
    // Just update this URL when ngrok link changes
    const ngrokUrl = "https://your-latest-ngrok-url.ngrok.io";
  </script>

</body>
</html>
